[stage]
# Lock Meta
IntlBackslash >> SuperLock
##################################################
[stage]
[modifier = "SuperLock"]
ContextActive >> Meta
#  Unlock
#Escape >>  Escape SuperLock
#Enter >> Enter  SuperLock
Super >> SuperLock
