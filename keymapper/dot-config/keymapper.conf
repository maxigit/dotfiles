SuperLock = Virtual1

Super = Enter | CapsLock

# Tap on hold Enter Enter / Super
Enter{CapsLock} >> SuperLock #### Extended on Tab
Enter{Meta} >> SuperLock #### Extended on Tab
Super{Any} >> Meta{Any}
Super{200ms} >> Meta
# NumPad
Tab{M} >> Numpad1
Tab{Comma} >> Numpad2
Tab{Period} >> Numpad3
Tab{J} >> Numpad4
