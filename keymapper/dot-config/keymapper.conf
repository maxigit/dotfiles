Tab{U} >> Numpad7
Tab{I} >> Numpad8
Tab{O} >> Numpad9
Tab{Space} >> Numpad0
Tab{7} >> NumLock
Tab{AltRight} >> NumpadDecimal
Tab{1} >> MediaTrackPrevious
Tab{2} >> MediaPlayPause
Tab{3} >> MediaTrackNext
